[package]
name = "aem-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
walkdir = "2.5"
winreg = "0.52"
sha2 = "0.10"
uuid = { version = "1.0", features = ["v4", "serde"] }
